<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章 | 小罗的Life</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js" defer></script>
  <script src="./js/supabase-client.js" defer></script>
  <script src="./js/data.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body data-page="articles">
  <div class="page-glow"></div>
  <header class="site-header">
    <a class="brand" href="./index.html"><span class="brand-mark" data-site-logo>罗</span><span data-site-name>小罗Blog</span></a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-label="打开导航">☰</button>
    <nav class="top-nav" data-nav>
      <a href="./index.html">首页</a><a class="active" href="./articles.html">所有文章</a><a href="./whispers.html">碎碎念</a><a href="./projects.html">个人项目</a><a href="./about.html">关于我</a><a href="./dashboard.html" data-admin-only hidden>后台</a>
    </nav>
    <div class="header-actions"><button class="icon-button" type="button" data-theme-toggle>◐</button><a class="ghost-button" href="./login.html" data-guest-only>登录</a><a class="primary-button small" href="./register.html" data-guest-only>注册</a><a class="user-entry" href="./dashboard.html" hidden><span class="user-avatar" data-profile-avatar>罗</span></a></div>
  </header>
  <main class="sub-page">
    <form class="article-filter-form" data-article-filter>
      <section class="page-title article-page-heading"><div><p class="eyebrow">ALL POSTS</p><h1>所有文章</h1><p>浏览文章记录。</p></div><div class="article-filter-search"><input name="q" type="search" placeholder="搜索文章" aria-label="搜索文章" /><button class="primary-button small" type="submit">搜索</button></div></section>
      <section class="filter-panel glass-card">
        <div class="article-filter-row"><span class="article-filter-label">分类</span><div class="article-filter-options" data-article-categories></div></div>
        <div class="article-filter-row"><span class="article-filter-label">标签</span><div class="article-filter-options" data-article-tags></div></div>
        <select name="category" data-category-filter hidden><option value="">全部分类</option></select>
        <select name="tag" data-tag-filter hidden><option value="">全部标签</option></select>
      </section>
    </form>
    <section class="article-grid list-grid article-list-layout" data-article-list></section>
    <nav class="pagination" data-pagination></nav>
  </main>
  <footer class="site-footer"><p>© 2026 小罗Blog</p></footer>
</body>
</html>
