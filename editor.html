<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新建/编辑文章 | 小罗的Life</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js" defer></script>
  <script src="./js/supabase-client.js" defer></script>
  <script src="./js/data.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body data-page="editor">
  <div class="page-glow"></div>
  <header class="site-header">
    <a class="brand" href="./index.html"><span class="brand-mark" data-site-logo>罗</span><span data-site-name>小罗Blog</span></a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-label="打开导航">☰</button>
    <nav class="top-nav" data-nav>
      <a href="./index.html">首页</a><a href="./articles.html">所有文章</a><a href="./whispers.html">碎碎念</a><a href="./projects.html">个人项目</a><a href="./about.html">关于我</a><a href="./dashboard.html">后台</a>
    </nav>
    <div class="header-actions"><button class="icon-button" type="button" data-theme-toggle>◐</button><button class="ghost-button" type="button" data-placeholder-action="logout">退出登录</button></div>
  </header>
  <main class="editor-page">
    <section class="page-title"><p class="eyebrow">WRITE POST</p><h1 data-editor-heading>新建文章</h1><p>写下新的内容。</p></section>
    <form class="editor-grid" data-editor-form data-supabase-action="posts.insert-or-update">
      <section class="editor-main glass-card">
        <label><span>文章标题</span><input name="title" type="text" placeholder="输入文章标题" required></label>
        <div class="rich-text-field"><span>正文内容</span><div class="text-format-editor"><div class="text-format-toolbar" data-format-toolbar><button type="button" data-format-action="bold" title="加粗（Ctrl+B）"><b>B</b></button><button type="button" data-format-action="underline" title="下划线（Ctrl+U）"><u>U</u></button><button type="button" data-format-action="link" title="添加超链接">↗</button><span class="format-toolbar-divider"></span><button type="button" class="format-highlight red" data-format-action="highlight" data-highlight-color="#ffddd8" title="红色高亮"></button><button type="button" class="format-highlight green" data-format-action="highlight" data-highlight-color="#d8f2e2" title="绿色高亮"></button><button type="button" class="format-highlight blue" data-format-action="highlight" data-highlight-color="#dce9ff" title="蓝色高亮"></button></div><div class="rich-text-input" data-format-input data-editor-content contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="直接输入正文；选择文字后可使用加粗、下划线、链接和高亮。"></div></div></div>
      </section>
      <aside class="editor-side glass-card">
        <label><span data-editor-cover-input-label>文章封面</span><input name="cover" type="file" accept="image/*" data-supabase-storage="post-covers"></label>
        <section class="editor-existing-media" data-editor-existing-cover hidden>
          <span>当前封面</span>
          <img data-editor-cover-preview alt="文章封面预览">
          <button class="danger-button" type="button" data-delete-post-cover>删除封面</button>
        </section>
        <label><span>文章附件</span><input name="attachments" type="file" multiple data-supabase-storage="post-attachments"></label>
        <section class="editor-existing-media" data-editor-existing-attachments hidden>
          <span>已有附件</span>
          <div class="editor-attachment-list" data-editor-attachment-list></div>
        </section>
        <label><span>文章配乐</span><input name="music" type="file" accept="audio/*"></label>
        <label><span>或使用音乐 URL</span><input name="musicUrl" type="url" placeholder="https://example.com/music.mp3"></label>
        <label><span>配乐歌名</span><input name="musicTitle" type="text" maxlength="120" placeholder="例如：如果的事（可不填，默认使用文件名）"></label>
        <section class="editor-existing-media" data-editor-existing-music hidden>
          <span>当前配乐</span>
          <div class="editor-attachment-list" data-editor-music-list></div>
        </section>
        <label><span>分类</span><select name="category" data-category-filter></select></label>
        <label><span>标签</span><input name="tags" type="text" placeholder="JavaScript, 生活, 复盘"></label>
        <label class="editor-visibility-field"><span>文章可见性</span><select name="visibility"><option value="published">公开：所有访客可见</option><option value="private">私密：仅管理员可见</option></select></label>
        <div class="editor-actions">
          <button class="ghost-button" type="button" data-editor-preview>预览</button>
          <button class="ghost-button" type="button" data-save-draft data-supabase-action="posts.saveDraft">保存草稿</button>
          <button class="primary-button" type="submit" data-publish-post data-supabase-action="posts.publish">发布文章</button>
          <a class="text-link" href="./dashboard.html">取消</a>
        </div>
      </aside>
    </form>
    <section class="preview-panel glass-card" data-preview-panel hidden><p class="mini-title">PREVIEW</p><h2 data-preview-title></h2><div data-preview-content></div></section>
  </main>
</body>
</html>
