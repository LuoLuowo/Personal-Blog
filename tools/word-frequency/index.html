<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语高频词 · 记忆卡片</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">EN</div>
      <div>
        <h1>英语高频词 · 记忆卡片</h1>
        <p class="subtitle">衣食住行 · 感觉需要 · 沟通状态 —— 1000 个高频词 + 360 个高频词组</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="stat-num" id="statWords">1000</span><span class="stat-label">高频单词</span></div>
      <div class="stat"><span class="stat-num" id="statPhrases">360</span><span class="stat-label">高频词组</span></div>
      <div class="stat"><span class="stat-num" id="statCats">26</span><span class="stat-label">分类场景</span></div>
    </div>
  </div>
</header>

<nav class="toolbar" id="toolbar">
  <div class="toolbar-inner">
    <div class="tabs">
      <button class="tab-btn active" data-tab="words">📖 高频单词 <span class="tab-count">1000</span></button>
      <button class="tab-btn" data-tab="phrases">💬 高频词组 <span class="tab-count">360</span></button>
    </div>

    <div class="controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索英文或中文…" autocomplete="off">
        <button class="clear-btn" id="clearSearch" title="清空">✕</button>
      </div>

      <div class="seg" id="directionSeg" title="切换卡片正反面语言">
        <button class="seg-btn active" data-dir="en2zh">英 → 中</button>
        <button class="seg-btn" data-dir="zh2en">中 → 英</button>
      </div>

      <div class="seg" id="viewSeg">
        <button class="seg-btn active" data-view="card">卡片</button>
        <button class="seg-btn" data-view="list">列表</button>
      </div>

      <button class="icon-btn" id="shuffleBtn" title="打乱顺序">🔀 随机</button>
    </div>

    <div class="cat-bar" id="catBar">
      <button class="chip active" data-cat="__all">全部</button>
    </div>
  </div>
</nav>

<main class="container">
  <div class="result-info">
    <span id="resultInfo">共 1000 条</span>
    <span class="flip-hint">💡 点击卡片翻转查看释义</span>
  </div>

  <div class="card-grid" id="cardGrid"></div>
  <div class="list-view" id="listView" hidden></div>

  <div class="empty" id="emptyState" hidden>
    <div class="empty-icon">🔎</div>
    <p>没有找到匹配的内容，换个关键词试试</p>
  </div>

  <div class="pagination" id="pagination"></div>
</main>

<footer class="site-footer">
  <p>英语高频词手册 · 1000 高频词 + 360 高频词组 · 点击卡片翻转，可切换中英文方向</p>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
