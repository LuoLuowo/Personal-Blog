<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国近代史互动时间线 · 1840—1949</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%238C2F2F'/%3E%3Crect x='8' y='30' width='48' height='6' rx='3' fill='%23C9A227'/%3E%3Ccircle cx='16' cy='30' r='7' fill='%23F5ECD7'/%3E%3Ctext x='32' y='52' font-size='13' text-anchor='middle' fill='%23F5ECD7' font-family='serif'%3E1840%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f5ecd7;
    --paper2:#efe2c6;
    --ink:#2b2823;
    --red:#8c2f2f;
    --red2:#a03a2f;
    --gold:#c9a227;
    --gold2:#b8921f;
    --line:#b8a582;
    --card:#fffaf0;
    --muted:#7a6f5c;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Noto Serif SC","Songti SC","SimSun",serif;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201,162,39,.10), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(140,47,47,.08), transparent 40%);
    color:var(--ink);
  }
  .wrap{display:flex;flex-direction:column;height:100vh;}

  /* ===== 顶部标题栏 ===== */
  header.topbar{
    flex:0 0 auto;position:sticky;top:0;z-index:60;
    background:linear-gradient(180deg,#8c2f2f,#7a2626);
    color:#f5ecd7;border-bottom:3px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .bar-row{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;}
  .brand{display:flex;flex-direction:column;margin-right:6px;}
  .brand h1{font-size:20px;letter-spacing:3px;font-weight:900;}
  .brand .sub{font-size:12px;color:#e6cfa0;letter-spacing:4px;}
  .search{flex:1;min-width:170px;position:relative;}
  .search input{
    width:100%;padding:8px 12px 8px 34px;border:1px solid #d8c9a3;border-radius:20px;
    background:var(--card);color:var(--ink);font-family:inherit;font-size:13px;outline:none;
  }
  .search .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#a39477;font-size:14px;}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tools button{
    border:1px solid #d8c9a3;background:rgba(245,236,215,.12);color:#f5ecd7;border-radius:6px;
    padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .tools button:hover{background:rgba(245,236,215,.28);}
  .tools button.active{background:var(--gold);color:#3a2c10;border-color:var(--gold);font-weight:700;}
  .tools .grp{display:flex;gap:6px;align-items:center;border-left:1px solid rgba(216,201,163,.4);padding-left:8px;}
  .jump-btn{min-width:52px;}
  .icon{font-style:normal;}
  .filters{max-width:1500px;margin:0 auto;padding:0 16px 9px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
  .filters .flabel{font-size:12px;color:#e6cfa0;letter-spacing:1px;}
  .filters button{
    border:1px solid #d8c9a3;background:transparent;color:#f5ecd7;border-radius:14px;padding:4px 12px;
    font-size:12px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .filters button:hover{background:rgba(245,236,215,.2);}
  .filters button.active{background:var(--gold);color:#3a2c10;border-color:var(--gold);font-weight:700;}

  /* ===== 时间线区域 ===== */
  section.timeline{
    flex:0 0 auto;position:sticky;top:0;z-index:50;background:var(--paper2);
    border-bottom:2px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.12);
  }
  .tl-hint{max-width:1500px;margin:0 auto;padding:6px 16px 0;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;}
  .tl-hint .legend{display:flex;gap:12px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:4px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.25);}
  .tl-viewport{max-width:1500px;margin:0 auto;overflow-x:auto;overflow-y:hidden;position:relative;scrollbar-width:thin;scrollbar-color:var(--red) transparent;cursor:grab;}
  .tl-viewport.dragging{cursor:grabbing;user-select:none;}
  .tl-viewport::-webkit-scrollbar{height:10px;}
  .tl-viewport::-webkit-scrollbar-thumb{background:var(--red);border-radius:5px;}
  .tl-viewport::-webkit-scrollbar-track{background:#dfd2b0;}
  .tl-inner{position:relative;}
  .tl-axis{position:absolute;left:0;right:0;height:3px;background:var(--red);border-radius:2px;}
  .tl-axis::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left-color:var(--red);}
  .year-mark{position:absolute;transform:translateX(-50%);}
  .year-mark .tick{width:1px;height:9px;background:var(--line);margin:0 auto;}
  .year-mark .ylab{
    font-size:var(--yearfs,10px);color:var(--muted);margin-top:2px;white-space:nowrap;text-align:center;
    background:var(--paper2);padding:0 3px;border-radius:3px;font-family:inherit;line-height:1.3;
  }
  .year-mark.major .ylab{color:var(--red);font-weight:700;}
  /* 节点：空容器，子元素按算好的绝对坐标摆放 */
  .node{position:absolute;width:0;height:0;cursor:pointer;z-index:5;}
  .node .ndot{
    position:absolute;left:0;top:-5px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 1px 3px rgba(0,0,0,.3);
  }
  .node .nlab{
    position:absolute;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:4px;
    padding:2px 6px;box-shadow:0 1px 3px rgba(0,0,0,.22);font-size:var(--labelfs,11px);font-weight:600;
    color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.55);line-height:1.35;
  }
  .node:hover .nlab{border-color:var(--gold);box-shadow:0 2px 7px rgba(0,0,0,.28);}
  .node.hl .ndot{box-shadow:0 0 0 3px var(--gold),0 1px 4px rgba(0,0,0,.4);}
  .node.hl .nlab{border-color:var(--gold);outline:1px solid var(--gold);}
  .node .conn{position:absolute;left:0;transform:translateX(-50%);width:2px;background:var(--line);}
  .legend .L-人物 .dot{background:var(--gold);} .legend .L-战役 .dot{background:#c0392b;}
  .legend .L-事件 .dot{background:#2f6fb0;} .legend .L-条约 .dot{background:#7d4a9e;}
  .legend .L-思想文化 .dot{background:#2f8f5b;}

  /* ===== 底部内容区 ===== */
  main.content{flex:1 1 auto;overflow-y:auto;padding:18px 16px 80px;}
  .content-inner{max-width:1100px;margin:0 auto;}
  .content-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .content-head .count{font-size:13px;color:var(--muted);}
  .content-head .sort{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .content-head .sort button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit;font-size:12px;}
  .content-head .sort button.active{background:var(--red);color:#f5ecd7;border-color:var(--red);}
  .year-group{margin-bottom:26px;}
  .year-group .yg-head{
    display:flex;align-items:center;gap:10px;margin-bottom:10px;
    border-left:5px solid var(--red);padding-left:10px;
  }
  .year-group .yg-head h2{font-size:18px;color:var(--red);letter-spacing:2px;}
  .year-group .yg-head .yline{flex:1;height:1px;background:var(--line);}
  .card{
    background:var(--card);border:1px solid #e4d7b6;border-radius:10px;padding:12px 14px;margin-bottom:10px;
    box-shadow:0 1px 4px rgba(90,70,30,.12);transition:.18s;cursor:pointer;position:relative;border-left:4px solid var(--line);
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 5px 16px rgba(90,70,30,.2);}
  .card.hl{outline:3px solid var(--gold);outline-offset:1px;}
  .card .c-top{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
  .card .c-date{font-size:12px;color:var(--muted);}
  .tag{font-size:11px;border-radius:10px;padding:1px 8px;color:#fff;font-weight:600;}
  .card .c-title{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:1px;}
  .card .c-meta{font-size:12px;color:var(--muted);margin:6px 0;display:flex;flex-wrap:wrap;gap:4px 14px;}
  .card .c-meta b{color:var(--ink);font-weight:600;}
  .card .c-desc{font-size:13px;line-height:1.7;color:#4a443a;margin-bottom:6px;}
  .card .c-result{font-size:12.5px;line-height:1.7;color:#5c4a2e;border-top:1px dashed var(--line);padding-top:6px;}
  .card .c-result b{color:var(--red);font-weight:700;}
  .card .c-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .c-tags span{font-size:11px;background:#eee2c4;color:#6a5a38;border-radius:4px;padding:1px 6px;}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;letter-spacing:1px;}

  /* ===== 影视作品区块 ===== */
  .films{margin-top:8px;border:1px solid #d8c9a3;border-radius:8px;background:linear-gradient(180deg,#fbf3dd,#f5e9c8);padding:8px 10px;}
  .films .films-head{
    font-size:12px;font-weight:700;color:var(--red);letter-spacing:2px;margin-bottom:6px;
    border-bottom:1px solid #d8c9a3;padding-bottom:4px;display:flex;align-items:center;gap:6px;
  }
  .films .films-head::before{content:"";width:4px;height:12px;background:var(--gold);border-radius:2px;display:inline-block;}
  .films .film-item{font-size:12.5px;line-height:1.7;color:#4a443a;padding:2px 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;}
  .films .film-item .fname{font-weight:600;color:var(--ink);}
  .films .film-item .fmeta{color:var(--muted);font-size:11.5px;}
  .films .rec-badge{
    font-size:10.5px;font-weight:700;color:#3a2c10;background:var(--gold);border:1px solid var(--gold2);
    border-radius:8px;padding:0 7px;letter-spacing:1px;line-height:1.5;
  }
  .films .rec-why{flex-basis:100%;font-size:12px;color:#6a4a1e;background:rgba(201,162,39,.14);border-left:3px solid var(--gold);padding:4px 8px;border-radius:0 4px 4px 0;line-height:1.6;}

  /* ===== 弹窗 ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(43,40,35,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;}
  .modal-mask.open{display:flex;}
  .modal{
    background:var(--card);border:2px solid var(--gold);border-radius:12px;max-width:640px;width:100%;
    max-height:86vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.4);animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-head{background:linear-gradient(180deg,var(--red),#7a2626);color:#f5ecd7;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-radius:10px 10px 0 0;}
  .modal-head h3{font-size:18px;letter-spacing:1px;}
  .modal-head .mdate{font-size:12px;color:#e6cfa0;margin-top:2px;}
  .modal-close{border:1px solid #d8c9a3;background:transparent;color:#f5ecd7;font-size:20px;line-height:1;width:28px;height:28px;border-radius:50%;cursor:pointer;}
  .modal-close:hover{background:rgba(255,255,255,.2);}
  .modal-body{padding:16px 20px 20px;}
  .mrow{display:flex;gap:8px;margin-bottom:10px;font-size:13px;line-height:1.65;}
  .mrow .mk{flex:0 0 62px;font-weight:700;color:var(--red);}
  .mrow .mv{color:#4a443a;}
  .mrow .mv .tag{margin-right:5px;}

  /* 响应式 */
  @media(max-width:640px){
    .brand h1{font-size:16px;letter-spacing:1px;}
    .bar-row{row-gap:6px;}
    .card .c-title{font-size:15px;}
    .content{padding:14px 10px 60px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 顶部标题栏 ===== -->
  <header class="topbar" id="topbar">
    <div class="bar-row">
      <div class="brand">
        <h1>中国近代史互动时间线</h1>
        <span class="sub">1840 — 1949</span>
      </div>
      <div class="search">
        <span class="sicon">⌕</span>
        <input id="searchInput" type="text" placeholder="搜索年份 / 人物 / 事件 / 战役 / 条约 / 地点…">
      </div>
      <div class="tools">
        <div class="grp" id="zoomGrp">
          <button id="zoomIn" title="放大时间线">＋放大</button>
          <button id="zoomOut" title="缩小时间线">－缩小</button>
          <button id="zoomReset" title="重置">↺重置</button>
        </div>
        <div class="grp" id="jumpGrp"></div>
      </div>
    </div>
    <div class="filters" id="filterBar"></div>
  </header>

  <!-- ===== 时间线区域 ===== -->
  <section class="timeline" id="timeline">
    <div class="tl-hint">
      <div>按住拖动 / 触摸滑动 / 滚轮横向滚动 · 悬停放大 · 点击节点或卡片查看详情</div>
      <div class="legend">
        <span class="L-人物"><i class="dot"></i>人物</span>
        <span class="L-战役"><i class="dot"></i>战役</span>
        <span class="L-事件"><i class="dot"></i>事件</span>
        <span class="L-条约"><i class="dot"></i>条约</span>
        <span class="L-思想文化"><i class="dot"></i>思想文化</span>
      </div>
    </div>
    <div class="tl-viewport" id="tlViewport">
      <div class="tl-inner" id="tlInner"></div>
    </div>
  </section>

  <!-- ===== 底部内容区 ===== -->
  <main class="content" id="content">
    <div class="content-inner">
      <div class="content-head">
        <div class="count" id="countInfo"></div>
        <div class="sort">
          <span>排序：</span>
          <button id="sortAsc" class="active">正序 ↑</button>
          <button id="sortDesc">倒序 ↓</button>
        </div>
      </div>
      <div id="list"></div>
    </div>
  </main>
</div>

<!-- ===== 详情弹窗 ===== -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div>
        <h3 id="mTitle"></h3>
        <div class="mdate" id="mDate"></div>
      </div>
      <button class="modal-close" id="mClose">×</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
/* =========================================================
   数据（DATA 数组）—— 中国近代史 1839—1949 关键节点
   字段：id,year,date,type,title,people,place,description,result,importance,tags
   ========================================================= */
const DATA = [
  // ---- 1839 虎门销烟 ----
  {id:1,year:1839,date:"1839年6月3日—25日",type:"事件",title:"林则徐虎门销烟",people:"林则徐",place:"广东虎门",description:"林则徐奉道光帝之命主持禁烟，在虎门海滩当众销毁收缴的鸦片约237万斤。",result:"沉重打击了英国鸦片商人的利益，向世界表明中国禁烟的决心，也成为鸦片战争爆发的导火索之一。",importance:"近代中国人民反抗外来侵略的重要起点，林则徐被誉为“开眼看世界的第一人”。",tags:["禁烟","反抗侵略"]},
  {id:2,year:1839,date:"1839年",type:"人物",title:"林则徐登场",people:"林则徐",place:"广东",description:"林则徐作为钦差大臣赴广东查禁鸦片，主持虎门销烟。",result:"其禁烟行动与睁眼看世界的做法，为近代中国了解西方开了先河。",importance:"近代民族英雄与开眼看世界的第一人。",tags:["人物","禁烟","开眼看世界"]},

  // ---- 1840 鸦片战争爆发 ----
  {id:3,year:1840,date:"1840年6月",type:"军事",title:"鸦片战争爆发",people:"琦善、义律等",place:"广东、浙江、天津沿海",description:"英国为打开中国市场、保护鸦片贸易，发动侵华战争，史称第一次鸦片战争。",result:"中国战败，被迫签订不平等条约，中国开始沦为半殖民地半封建社会。",importance:"中国近代史的开端，中国社会性质开始发生根本变化。",tags:["战争","民族危机"]},
  {id:4,year:1841,date:"1841年5月",type:"事件",title:"三元里人民抗英斗争",people:"三元里民众",place:"广州三元里",description:"广州三元里人民自发组织起来抗击英国侵略军，是近代中国人民自发反抗外来侵略的著名斗争。",result:"有力地打击了英国侵略者的气焰，显示了人民群众的巨大力量。",importance:"近代中国人民自发反抗外国侵略的光辉范例。",tags:["民众抗争","反抗侵略"]},

  // ---- 1842 南京条约 ----
  {id:5,year:1842,date:"1842年8月",type:"条约",title:"《南京条约》签订",people:"耆英、伊里布（清）",place:"南京",description:"清政府被迫与英国签订《南京条约》，主要内容：割让香港岛、赔款2100万银元、开放五口通商、协定关税。",result:"中国近代史上第一个丧权辱国的不平等条约，中国开始丧失领土与主权。",importance:"标志着中国开始沦为半殖民地半封建社会。",tags:["不平等条约","丧权辱国"]},
  {id:6,year:1843,date:"1843年",type:"条约",title:"《虎门条约》签订",people:"—",place:"虎门",description:"英国借此获取领事裁判权、片面最惠国待遇及在通商口岸租地建屋等特权。",result:"进一步扩大英国在华特权，中国主权进一步受损。",importance:"《南京条约》的补充条款，列强攫取更多特权的开端。",tags:["不平等条约"]},

  // ---- 1844 ----
  {id:7,year:1844,date:"1844年",type:"条约",title:"《望厦条约》《黄埔条约》",people:"—",place:"澳门、广州",description:"美国与法国相继强迫清政府签订《望厦条约》和《黄埔条约》，取得协定关税、传教等特权。",result:"列强纷纷效仿英国攫取在华特权。",importance:"列强共同侵华格局逐步形成。",tags:["不平等条约"]},

  // ---- 1851 太平天国 ----
  {id:8,year:1851,date:"1851年1月11日",type:"军事",title:"金田起义·太平天国运动爆发",people:"洪秀全",place:"广西桂平金田村",description:"洪秀全领导拜上帝会众在金田村起义，建号太平天国。",result:"太平天国运动正式爆发，迅速发展为规模宏大的农民战争。",importance:"中国历史上规模最大的农民战争。",tags:["农民战争","起义"]},
  {id:9,year:1851,date:"1851年",type:"人物",title:"洪秀全登场",people:"洪秀全",place:"广西金田",description:"洪秀全发动金田起义，领导太平天国运动。",result:"建立太平天国政权，坚持斗争十余年。",importance:"太平天国运动的领袖。",tags:["人物","农民起义"]},
  {id:10,year:1853,date:"1853年",type:"政治",title:"太平天国定都天京",people:"洪秀全、杨秀清",place:"南京（天京）",description:"太平军攻占南京，改名天京定为都城，并颁布《天朝田亩制度》。",result:"太平天国建立起与清政府对峙的农民政权。",importance:"太平天国运动进入鼎盛时期。",tags:["农民政权","土地制度"]},

  {id:51,year:1915,date:"1915年9月",type:"思想文化",title:"新文化运动兴起",people:"陈独秀、李大钊、胡适、鲁迅",place:"上海、北京",description:"陈独秀创办《青年杂志》（后改名《新青年》），高举“民主”与“科学”两面大旗，掀起新文化运动。",result:"动摇了封建思想的统治地位，促进了人们的思想解放。",importance:"近代一次伟大的思想解放运动。",tags:["思想解放","民主科学"]},
  {id:52,year:1915,date:"1915年",type:"人物",title:"陈独秀登场",people:"陈独秀",place:"上海",description:"陈独秀创办《新青年》，发起新文化运动。",result:"成为新文化运动的领袖，后参与创建中国共产党。",importance:"新文化运动的旗手。",tags:["人物","新文化运动"]},
  {id:53,year:1915,date:"1915年12月",type:"政治",title:"袁世凯复辟帝制",people:"袁世凯",place:"北京",description:"袁世凯宣布改国号为“中华帝国”，准备称帝。",result:"遭到全国人民的强烈反对，护国运动兴起，袁世凯被迫取消帝制，最终忧惧而死。",importance:"复辟帝制的倒行逆施以失败告终。",tags:["复辟","称帝"]},
  {id:54,year:1916,date:"1916年",type:"军事",title:"护国运动",people:"蔡锷、唐继尧等",place:"云南、西南各省",description:"蔡锷等在云南宣布独立，组织护国军讨伐袁世凯。",result:"袁世凯被迫取消帝制，复辟失败。",importance:"维护共和、反对复辟的斗争。",tags:["护国","讨袁"]},

  // ---- 1918 鲁迅 ----
  {id:55,year:1918,date:"1918年5月",type:"思想文化",title:"鲁迅发表《狂人日记》",people:"鲁迅",place:"《新青年》",description:"鲁迅在《新青年》发表白话小说《狂人日记》，深刻揭露封建礼教的吃人本质。",result:"中国现代文学史上第一篇白话小说，推动了文学革命。",importance:"新文化运动中文学革命的代表作。",tags:["文学革命","白话文"]},
  {id:56,year:1918,date:"1918年",type:"人物",title:"鲁迅登场",people:"鲁迅",place:"北京",description:"鲁迅投身新文化运动，发表《狂人日记》等作品。",result:"以笔为武器，深刻批判封建礼教，成为新文化运动的干将。",importance:"伟大的文学家、思想家、革命家。",tags:["人物","文学"]},

  // ---- 1919 五四运动 ----
  {id:57,year:1919,date:"1919年5月4日",type:"事件",title:"五四运动爆发",people:"北京学生、陈独秀、李大钊",place:"北京",description:"为抗议巴黎和会上中国外交的失败，北京学生举行游行示威，提出“外争主权，内除国贼”等口号，运动后扩展到上海等城市，工人阶级登上政治舞台。",result:"北洋政府被迫拒绝在和约上签字，运动取得初步胜利。",importance:"中国新民主主义革命的开端。",tags:["反帝反封建","新民主主义革命"]},
  {id:58,year:1919,date:"1919年",type:"思想文化",title:"李大钊传播马克思主义",people:"李大钊",place:"北京",description:"李大钊发表《我的马克思主义观》，系统介绍马克思主义学说。",result:"推动了马克思主义在中国的传播。",importance:"为中国共产党成立奠定思想基础。",tags:["马克思主义","思想传播"]},
  {id:59,year:1919,date:"1919年",type:"人物",title:"李大钊登场",people:"李大钊",place:"北京",description:"李大钊是新文化运动的领袖，也是在中国系统传播马克思主义的第一人。",result:"其思想影响了大批先进青年，推动了建党进程。",importance:"中国最早的马克思主义者。",tags:["人物","马克思主义"]},

  // ---- 1921 中共成立 ----
  {id:60,year:1921,date:"1921年7月",type:"政治",title:"中国共产党成立",people:"陈独秀、李大钊、毛泽东、董必武等",place:"上海",description:"中国共产党第一次全国代表大会在上海召开，标志着中国共产党正式成立。",result:"中国革命从此有了坚强的领导核心，中国革命的面貌焕然一新。",importance:"中国历史上开天辟地的大事变。",tags:["建党","无产阶级政党"]},
  {id:61,year:1922,date:"1922年7月",type:"政治",title:"中共二大召开",people:"—",place:"上海",description:"中共二大提出党的最低纲领（民主革命纲领）和最高纲领，第一次明确提出反帝反封建的民主革命纲领。",result:"为中国人民的革命斗争指明了方向。",importance:"中国近代史上第一次明确提出反帝反封建的民主革命纲领。",tags:["纲领","党建"]},
  {id:62,year:1923,date:"1923年2月",type:"社会",title:"京汉铁路工人大罢工",people:"—",place:"京汉铁路沿线",description:"京汉铁路工人为争取自由民主权利举行大罢工，遭到军阀血腥镇压。",result:"中国工人运动第一次高潮的顶点，也使其转入低潮。",importance:"使党认识到建立统一战线和武装斗争的重要性。",tags:["工人运动"]},

  // ---- 1924 第一次国共合作 ----
  {id:63,year:1924,date:"1924年1月",type:"政治",title:"第一次国共合作实现",people:"孙中山、李大钊等",place:"广州",description:"中国国民党第一次全国代表大会在广州召开，确立联俄、联共、扶助农工三大政策，国共两党实现第一次合作。",result:"推动了国民革命运动的兴起，为北伐战争创造了条件。",importance:"统一战线的建立，推动了反帝反封建的国民革命。",tags:["统一战线","合作"]},
  {id:64,year:1925,date:"1925年",type:"事件",title:"五卅运动",people:"—",place:"上海",description:"上海工人、学生为抗议日本资本家枪杀中国工人顾正红举行反帝爱国运动，运动迅速扩展到全国。",result:"掀起了全国规模的反帝爱国运动高潮。",importance:"五卅运动是国民大革命高潮的重要组成部分。",tags:["反帝","工人运动"]},

  // ---- 1926 北伐战争 ----
  {id:65,year:1926,date:"1926年7月",type:"军事",title:"北伐战争开始",people:"蒋介石、叶挺等",place:"湖南、湖北、江西等",description:"国民革命军誓师北伐，以推翻北洋军阀统治为目标，叶挺独立团英勇作战，被誉为“铁军”。",result:"基本推翻了北洋军阀的统治，沉重打击了帝国主义和封建势力。",importance:"国共合作下进行的反帝反封建的国民革命。",tags:["北伐","国民革命"]},

  {id:66,year:1927,date:"1927年4月12日",type:"政治",title:"四一二反革命政变",people:"蒋介石",place:"上海",description:"蒋介石在上海发动四一二反革命政变，大肆屠杀共产党人和革命群众，国民革命局部失败。",result:"第一次国共合作开始破裂，大革命走向失败。",importance:"大革命从高潮转入失败的转折点。",tags:["政变","国共分裂"]},
  {id:67,year:1927,date:"1927年8月1日",type:"军事",title:"南昌起义",people:"周恩来、贺龙、叶挺、朱德、刘伯承",place:"江西南昌",description:"中共发动南昌起义，打响武装反抗国民党反动派的第一枪。",result:"标志着中国共产党独立领导武装斗争和创建人民军队的开始。",importance:"建军节的由来，人民军队诞生的标志。",tags:["武装起义","建军"]},
  {id:68,year:1927,date:"1927年9月",type:"军事",title:"秋收起义",people:"毛泽东",place:"湘赣边界",description:"毛泽东领导湘赣边界秋收起义，后率部进军井冈山，开辟农村包围城市的革命道路。",result:"建立了井冈山革命根据地，找到中国革命正确道路。",importance:"农村包围城市、武装夺取政权道路的开端。",tags:["起义","革命道路"]},
  {id:69,year:1927,date:"1927年10月",type:"政治",title:"井冈山革命根据地创建",people:"毛泽东",place:"江西井冈山",description:"毛泽东创建井冈山革命根据地，这是中国共产党创建的第一个农村革命根据地。",result:"点燃了“工农武装割据”的星星之火。",importance:"中国革命走农村包围城市道路的伟大实践。",tags:["根据地","工农武装割据"]},
  {id:70,year:1927,date:"1927年",type:"人物",title:"毛泽东登场",people:"毛泽东",place:"湘赣、井冈山",description:"毛泽东领导秋收起义，创建井冈山革命根据地。",result:"开辟了农村包围城市、武装夺取政权的正确革命道路，并最终领导中国革命取得胜利。",importance:"中国革命的伟大领袖。",tags:["人物","革命领袖"]},
  {id:71,year:1927,date:"1927年",type:"人物",title:"周恩来登场",people:"周恩来",place:"南昌",description:"周恩来参与领导南昌起义，打响武装反抗国民党反动派第一枪。",result:"后长期担任党和国家重要领导职务，为革命和建设作出重大贡献。",importance:"中国共产党的优秀领导人。",tags:["人物","革命领袖"]},
  {id:72,year:1927,date:"1927年",type:"人物",title:"蒋介石登场",people:"蒋介石",place:"上海、南京",description:"蒋介石发动四一二政变，后建立南京国民政府，走向独裁统治。",result:"其后长期坚持反共内战，最终败退台湾。",importance:"国民党的主要统治者。",tags:["人物","国民党"]},

  {id:83,year:1936,date:"1936年",type:"人物",title:"张学良登场",people:"张学良",place:"西安",description:"张学良与杨虎城发动西安事变，逼蒋抗日。",result:"促成抗日民族统一战线初步形成，民族大义之举。",importance:"西安事变的主要发动者。",tags:["人物","抗日"]},

/* =========================================================
   状态
   ========================================================= */
const state = {
  zoom:1,
  filter:"全部",
  search:"",
  sortAsc:true,
  selectedId:null
};
const MIN_YEAR = 1839, MAX_YEAR = 1949;
const BASE_SPACING = 46;

/* =========================================================
   工具
   ========================================================= */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function filteredData(){
  let d = DATA.slice();
  if(state.filter!=="全部") d = d.filter(it=>it.type===state.filter);
  if(state.search){
    const q = state.search.trim().toLowerCase();
    d = d.filter(it=>{
      const hay = [it.year,it.date,it.title,it.people,it.place,it.description,it.result,it.importance,(it.tags||[]).join(" ")].join(" ").toLowerCase();
      return hay.indexOf(q)>=0;
    });
  }
  if(state.sortAsc) d.sort((a,b)=>a.year-b.year||a.id-b.id);
  else d.sort((a,b)=>b.year-a.year||b.id-a.id);
  return d;
}

function grouped(d){
  const map = {};
  d.forEach(it=>{ (map[it.year]=map[it.year]||[]).push(it); });
  return Object.keys(map).map(Number).sort((a,b)=>state.sortAsc?a-b:b-a);
}

/* =========================================================
   时间线渲染（lane 分配布局算法）
   ========================================================= */
const tlViewport = document.getElementById("tlViewport");
const tlInner = document.getElementById("tlInner");

/* 布局常量 */
const ABOVE_GAP0 = 16;   // 轴上方 lane0 标签底边距轴线
const BELOW_GAP0 = 30;   // 轴下方 lane0 标签顶边距轴线（留出年份刻度）
const LANE_BUF = 2;      // 同 lane 标签水平间距缓冲(px)
const MAX_LANE = 24;

function yearX(year){
  return (year - MIN_YEAR) * BASE_SPACING * state.zoom + 40;
}
function innerWidth(){
  return (MAX_YEAR - MIN_YEAR) * BASE_SPACING * state.zoom + 200;
}
function clampNum(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

/* 标签字号随 zoom：缩小不低于 10px，放大不超过 16px */
function labelFontPx(){ return clampNum(11*Math.sqrt(state.zoom), 10, 16); }
function yearFontPx(){  return clampNum(10*Math.sqrt(state.zoom), 9, 13); }

/* 标签宽度估算：CJK≈1em，ASCII≈0.56em，加内边距+边框 */
function estLabelW(title, fontPx){
  let cjk=0, ascii=0;
  for(const ch of String(title)){
    if(/[\u3000-\u303f\uff00-\uffef\u4e00-\u9fff《》「」—…·]/.test(ch)) cjk++;
    else ascii++;
  }
  return (cjk*1 + ascii*0.56) * fontPx + 14;
}

/* lane 分配：从左到右处理可见节点，为每个节点选第一个不冲突的 (side,lane) */
function layoutNodes(visNodes){
  const fontPx = labelFontPx();
  const labelH = fontPx*1.35 + 6;
  const STEP = labelH + 8;
  const placed = {above:[], below:[]}; // placed[side][k] = [[x1,x2],...]
  const result = [];
  const sorted = visNodes.slice().sort((a,b)=> yearX(a.year)-yearX(b.year) || a.id-b.id);
  sorted.forEach(it=>{
    const x = yearX(it.year);
    const w = estLabelW(it.title, fontPx);
    const half = w/2;
    const nx1 = x-half, nx2 = x+half;
    let chosen = null;
    for(let k=0;k<MAX_LANE;k++){
      // 候选顺序：上0、下0、上1、下1、上2、下2…
      for(const side of ['above','below']){
        const arr = placed[side][k] || [];
        const conflict = arr.some(([x1,x2])=> nx1 < x2 - LANE_BUF && nx2 > x1 + LANE_BUF);
        if(!conflict){ chosen = {side,k}; break; }
      }
      if(chosen) break;
    }
    if(!chosen) chosen = {side:'below', k:MAX_LANE-1};
    (placed[chosen.side][chosen.k] = placed[chosen.side][chosen.k]||[]).push([nx1,nx2]);
    result.push({it, x, w, side:chosen.side, lane:chosen.k});
  });
  let maxAbove=-1, maxBelow=-1;
  placed.above.forEach((a,i)=>{ if(a&&a.length) maxAbove=i; });
  placed.below.forEach((a,i)=>{ if(a&&a.length) maxBelow=i; });
  return {result, fontPx, labelH, STEP, maxAbove, maxBelow};
}

let _tlInited = false;

function renderTimeline(){
  const zoom = state.zoom;
  const oldScroll = tlViewport.scrollLeft;
  const vw = tlViewport.clientWidth || 1200;
  // 渲染前：记录视口中心年份，用于缩放/筛选后保持中心
  const centerX = oldScroll + vw/2;
  const centerYear = MIN_YEAR + (centerX - 40)/(BASE_SPACING*zoom);

  const visNodes = filteredData().slice().sort((a,b)=>a.year-b.year||a.id-b.id);
  const lay = layoutNodes(visNodes);
  const {labelH, STEP, maxAbove, maxBelow, fontPx} = lay;

  /* 根据占用行数计算轴线 Y 与内高 */
  const aboveUsed = maxAbove<0 ? 0 : ABOVE_GAP0 + maxAbove*STEP + labelH;
  const belowUsed = BELOW_GAP0 + (maxBelow<0 ? 0 : maxBelow*STEP + labelH);
  let topNeed = aboveUsed + 10;
  let bottomNeed = belowUsed + 12;
  let raw = topNeed + bottomNeed;
  let axisY, innerH;
  if(raw < 228){
    const extra = 228 - raw;
    axisY = topNeed + extra*(topNeed/raw);
    innerH = 228;
  } else {
    axisY = topNeed;
    innerH = raw;
  }

  /* CSS 变量：字号随 zoom */
  tlInner.style.setProperty('--labelfs', fontPx.toFixed(1)+'px');
  tlInner.style.setProperty('--yearfs', yearFontPx().toFixed(1)+'px');

  /* 年份刻度 */
  const spacing = BASE_SPACING*zoom;
  const showMinor = spacing >= 28;
  let yh = '<div class="tl-axis" style="top:'+axisY+'px"></div>';
  for(let y=MIN_YEAR;y<=MAX_YEAR;y++){
    const major = (y%10===0)||y===1949||JUMP_YEARS.indexOf(y)>=0;
    const showLab = showMinor || major || (y%5===0);
    yh += '<div class="year-mark'+(major?' major':'')+'" style="left:'+yearX(y)+'px;top:'+axisY+'px">'
       +'<div class="tick"></div>'
       +(showLab ? '<div class="ylab">'+y+'</div>' : '')
       +'</div>';
  }

  /* 节点 */
  let nodes = "";
  lay.result.forEach(p=>{
    const {it,x,side,lane} = p;
    const c = TYPE_COLOR[it.type]||"#8a8271";
    const color = it.type==="人物" ? "var(--gold)" : c;
    let labelTopRel, connTopRel, connH;
    if(side==='above'){
      const labelBottomRel = -(ABOVE_GAP0 + lane*STEP); // 相对轴线
      labelTopRel = labelBottomRel - labelH;
      connTopRel = labelBottomRel;
      connH = (-5) - labelBottomRel;   // 从标签底到 dot 顶(-5)
    } else {
      labelTopRel = BELOW_GAP0 + lane*STEP;
      connTopRel = 8;                   // dot 底
      connH = labelTopRel - 8;
    }
    const labelLeftRel = -p.w/2;
    nodes += '<div class="node '+side+'" data-id="'+it.id+'" style="left:'+x+'px;top:'+axisY+'px" title="'+esc(it.title)+' · '+it.year+'年">'
      +'<div class="ndot" style="background:'+color+'"></div>'
      +'<span class="nlab" style="left:'+labelLeftRel+'px;top:'+labelTopRel+'px">'+esc(it.title)+'</span>'
      +'<span class="conn" style="top:'+connTopRel+'px;height:'+Math.max(1,connH)+'px;background:'+color+'"></span>'
      +'</div>';
  });

  tlInner.innerHTML = yh + nodes;
  tlInner.style.width = innerWidth()+"px";
  tlInner.style.height = innerH+"px";
  tlViewport.style.height = (innerH + 14)+"px";

  /* 恢复视口中心年份 */
  const newScroll = yearX(centerYear) - vw/2;
  const maxScroll = tlInner.scrollWidth - vw;
  tlViewport.scrollLeft = _tlInited ? clampNum(newScroll, 0, Math.max(0,maxScroll)) : 0;
  _tlInited = true;
  clearHighlights();
}

function clearHighlights(){
  tlInner.querySelectorAll(".node.hl").forEach(n=>n.classList.remove("hl"));
  document.querySelectorAll(".card.hl").forEach(c=>c.classList.remove("hl"));
  state.selectedId = null;
}

function scrollTimelineToYear(year){
  const target = yearX(year) - tlViewport.clientWidth/2;
  tlViewport.scrollLeft = Math.max(0, Math.min(target, tlViewport.scrollWidth - tlViewport.clientWidth));
}

function highlightNode(id){
  clearHighlights();
  const rec = DATA.find(d=>d.id===id);
  const n = tlInner.querySelector('.node[data-id="'+id+'"]');
  if(n){ n.classList.add("hl"); if(rec) scrollTimelineToYear(rec.year); }
  const card = document.querySelector('.card[data-id="'+id+'"]');
  if(card){ card.classList.add("hl"); card.scrollIntoView({behavior:"smooth",block:"center"}); }
  state.selectedId = id;
}

/* =========================================================
   时间线交互：拖拽 / 触摸 / 滚轮
   ========================================================= */
let isDragging=false, startX=0, startScroll=0;
tlViewport.addEventListener("mousedown",e=>{
  if(e.target.closest(".node")) return;
  isDragging=true; startX=e.clientX; startScroll=tlViewport.scrollLeft;
  tlViewport.classList.add("dragging");
});
window.addEventListener("mousemove",e=>{
  if(!isDragging) return;
  tlViewport.scrollLeft = startScroll - (e.clientX - startX);
});
window.addEventListener("mouseup",()=>{
  isDragging=false; tlViewport.classList.remove("dragging");
});
tlViewport.addEventListener("wheel",e=>{
  e.preventDefault();
  tlViewport.scrollLeft += e.deltaY + e.deltaX;
},{passive:false});
// 触摸
let touchX=0;
tlViewport.addEventListener("touchstart",e=>{ touchX=e.touches[0].clientX; },{passive:true});
tlViewport.addEventListener("touchmove",e=>{
  const dx = touchX - e.touches[0].clientX;
  tlViewport.scrollLeft += dx; touchX = e.touches[0].clientX;
},{passive:true});

/* 节点点击 */
tlInner.addEventListener("click",e=>{
  const node = e.target.closest(".node");
  if(node){ openDetail(parseInt(node.dataset.id),true); }
});

/* =========================================================
   底部列表渲染
   ========================================================= */
function renderList(){
  const d = filteredData();
  const years = grouped(d);
  const list = document.getElementById("list");
  document.getElementById("countInfo").textContent = "共 " + d.length + " 条记录 · " + years.length + " 个年份";
  if(!d.length){
    list.innerHTML = '<div class="empty">未找到匹配内容，请调整搜索或筛选条件</div>';
    return;
  }
  let html = "";
  years.forEach(y=>{
    html += '<div class="year-group"><div class="yg-head"><h2>'+y+'年</h2><div class="yline"></div></div>';
    d.filter(it=>it.year===y).forEach(it=>{ html += cardHTML(it); });
    html += '</div>';
  });
  list.innerHTML = html;
  if(state.selectedId) highlightNode(state.selectedId);
}

/* 影视作品：卡片内紧凑列表（名称（类型·年份）+ 最推荐徽标） */
function filmsCardHTML(it){
  const f = FILMS[it.id];
  if(!f || !f.films || !f.films.length) return '';
  let h = '<div class="films"><div class="films-head">影视作品</div>';
  f.films.forEach((fm,i)=>{
    const isTop = (i===f.topIdx);
    h += '<div class="film-item">'
      +'<span class="fname">'+esc(fm.name)+'</span>'
      +'<span class="fmeta">（'+esc(fm.type||'')+(fm.year?'·'+esc(fm.year):'')+'）</span>'
      +(isTop?'<span class="rec-badge">最推荐</span>':'')
      +'</div>';
  });
  h += '</div>';
  return h;
}
/* 影视作品：弹窗内完整列表 + 最推荐条目推荐理由 */
function filmsModalHTML(it){
  const f = FILMS[it.id];
  if(!f || !f.films || !f.films.length) return '';
  let h = '<div class="films"><div class="films-head">影视作品</div>';
  f.films.forEach((fm,i)=>{
    const isTop = (i===f.topIdx);
    h += '<div class="film-item">'
      +'<span class="fname">'+esc(fm.name)+'</span>'
      +'<span class="fmeta">'+esc(fm.type||'')+(fm.year?' · '+esc(fm.year):'')+'</span>'
      +(isTop?'<span class="rec-badge">最推荐</span>':'')
      +(isTop && f.topWhy ? '<div class="rec-why">'+esc(f.topWhy)+'</div>' : '')
      +'</div>';
  });
  h += '</div>';
  return h;
}

function cardHTML(it){
  const c = TYPE_COLOR[it.type]||"#8a8271";
  return '<div class="card" data-id="'+it.id+'" style="border-left-color:'+c+'">'
    +'<div class="c-top"><span class="c-date">'+esc(it.date)+'</span>'
    +'<span class="tag" style="background:'+c+'">'+esc(it.type)+'</span></div>'
    +'<div class="c-title">'+esc(it.title)+'</div>'
    +'<div class="c-meta">'
    +(it.people&&it.people!=="—"?'<span><b>关键人物：</b>'+esc(it.people)+'</span>':'')
    +(it.place&&it.place!=="—"?'<span><b>地点：</b>'+esc(it.place)+'</span>':'')
    +'</div>'
    +'<div class="c-desc">'+esc(it.description)+'</div>'
    +'<div class="c-result"><b>结果 / 影响：</b>'+esc(it.result)+'</div>'
    +filmsCardHTML(it)
    +'<div class="c-tags">'+(it.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>'
    +'</div>';
}

/* 卡片点击 */
document.getElementById("list").addEventListener("click",e=>{
  const card = e.target.closest(".card");
  if(card) openDetail(parseInt(card.dataset.id),true);
});

/* =========================================================
   详情弹窗
   ========================================================= */
function openDetail(id,locate){
  const it = DATA.find(d=>d.id===id);
  if(!it) return;
  if(locate) highlightNode(id);
  const c = TYPE_COLOR[it.type]||"#8a8271";
  document.getElementById("mTitle").textContent = it.title;
  document.getElementById("mDate").textContent = it.date + " · " + it.year + "年 · " + it.type;
  let b = '';
  b += row("类型",'<span class="tag" style="background:'+c+'">'+esc(it.type)+'</span>');
  b += row("时间",esc(it.date));
  b += row("关键人物",esc(it.people||"—"));
  b += row("地点",esc(it.place||"—"));
  b += row("经过",esc(it.description));
  b += row("结果",esc(it.result));
  b += row("历史影响",esc(it.importance||"—"));
  b += row("标签",(it.tags||[]).map(t=>'<span class="tag" style="background:#8a8271">'+esc(t)+'</span>').join(' '));
  const fm = filmsModalHTML(it);
  if(fm) b += '<div class="mrow"><span class="mk"></span><span class="mv" style="flex:1">'+fm+'</span></div>';
  document.getElementById("mBody").innerHTML = b;
  document.getElementById("modalMask").classList.add("open");
}
function row(k,v){
  return '<div class="mrow"><span class="mk">'+k+'</span><span class="mv">'+v+'</span></div>';
}
function closeModal(){
  document.getElementById("modalMask").classList.remove("open");
}
document.getElementById("mClose").addEventListener("click",closeModal);
document.getElementById("modalMask").addEventListener("click",e=>{
  if(e.target.id==="modalMask") closeModal();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* =========================================================
   筛选栏 / 跳转按钮 / 缩放 / 搜索 / 排序
   ========================================================= */
function renderFilterBar(){
  const bar = document.getElementById("filterBar");
  let html = '<span class="flabel">筛选：</span>';
  const types = ["全部"].concat(FILTER_TYPES);
  html += types.map(t=>
    '<button class="'+(state.filter===t?'active':'')+'" data-f="'+t+'">'+t+'</button>'
  ).join('');
  bar.innerHTML = html;
}
document.getElementById("filterBar").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.filter = b.dataset.f;
  renderFilterBar(); renderList(); renderTimeline();
});

function renderJumpBar(){
  const g = document.getElementById("jumpGrp");
  g.innerHTML = JUMP_YEARS.map(y=>'<button class="jump-btn" data-j="'+y+'">'+y+'</button>').join('');
}
document.getElementById("jumpGrp").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  scrollTimelineToYear(parseInt(b.dataset.j));
});

document.getElementById("zoomIn").addEventListener("click",()=>{ state.zoom=Math.min(3,state.zoom+0.4); renderTimeline(); });
document.getElementById("zoomOut").addEventListener("click",()=>{ state.zoom=Math.max(0.5,state.zoom-0.4); renderTimeline(); });
document.getElementById("zoomReset").addEventListener("click",()=>{ state.zoom=1; renderTimeline(); });

document.getElementById("searchInput").addEventListener("input",e=>{
  state.search = e.target.value;
  renderList();
  renderTimeline();
});

document.getElementById("sortAsc").addEventListener("click",()=>{
  state.sortAsc=true; document.getElementById("sortAsc").classList.add("active"); document.getElementById("sortDesc").classList.remove("active"); renderList();
});
document.getElementById("sortDesc").addEventListener("click",()=>{
  state.sortAsc=false; document.getElementById("sortDesc").classList.add("active"); document.getElementById("sortAsc").classList.remove("active"); renderList();
});

/* =========================================================
   初始化
   ========================================================= */
renderFilterBar();
renderJumpBar();
renderTimeline();
renderList();
</script>
</body>
</html>
