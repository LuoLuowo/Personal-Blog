<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101a2c" />
  <title>小罗跳一跳 | 小罗的Life</title>
  <link rel="icon" href="./assets/images/xiaoluo-jump-game-icon.jpg" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./font_fuhbx0kh6gc/iconfont.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabase-config.js" defer></script>
  <script src="./js/supabase-client.js" defer></script>
  <script src="./js/data.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script src="./js/game.js" defer></script>
</head>
<body class="game-page" data-page="game">
  <header class="site-header">
    <a class="brand" href="./index.html"><span class="brand-mark" data-site-logo></span><span data-site-name>小罗Blog</span></a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-label="打开导航">☰</button>
    <nav class="top-nav" data-nav aria-label="主导航"><a href="./index.html">首页</a><a href="./articles.html">所有文章</a><a href="./life.html">生活圈</a><a href="./whispers.html">碎碎念</a><a href="./projects.html">个人项目</a><a href="./about.html">关于我</a><a href="./dashboard.html" data-admin-only hidden>后台</a></nav>
    <div class="header-actions"><button class="icon-button" type="button" data-theme-toggle aria-label="切换日夜模式">◐</button><a class="ghost-button" href="./login.html" data-guest-only>登录</a><a class="primary-button small" href="./register.html" data-guest-only>注册</a><a class="user-entry" href="./dashboard.html" aria-label="用户后台" hidden><span class="user-avatar" data-profile-avatar>罗</span></a></div>
  </header>
  <main class="jump-game-shell">
    <div class="game-space-toolbar">
      <a class="game-back" href="./index.html">返回小罗Blog</a>
    </div>
    <section class="game-panel">
      <aside class="game-catalog">
        <nav class="game-side-list" aria-label="小游戏列表">
          <p class="mini-title">小游戏列表</p>
          <a class="active" href="./game.html" aria-current="page"><b>跳</b><span><strong>跳一跳</strong><small>蓄力起跳</small></span></a>
          <a href="./snake.html"><b>蛇</b><span><strong>贪吃蛇</strong><small>方向操控</small></span></a>
        </nav>
      </aside>
      <aside class="game-intro">
        <img src="./assets/images/xiaoluo-jump-game-icon.jpg" alt="小罗跳一跳" />
        <p class="mini-title">XIAOLUO MINI GAME</p>
        <h1>小罗跳一跳</h1>
        <p>按住蓄力，松开起跳。落在方块中央，可以得到更多分数。</p>
        <div class="game-tips"><span>鼠标或触屏</span><span>空格键</span><span>R 键重开</span></div>
      </aside>
      <section class="game-stage-wrap">
        <div class="game-scorebar"><div><span>本局得分</span><strong data-game-score>0</strong></div><div><span>最高记录</span><strong data-game-best>0</strong></div><button type="button" data-game-restart aria-label="重新开始">重开</button></div>
        <canvas data-jump-canvas width="800" height="1120" aria-label="小罗跳一跳游戏画面"></canvas>
        <p class="game-hint" data-game-hint>按住画面开始蓄力</p>
      </section>
      <aside class="game-leaderboard" aria-label="跳一跳排行榜">
        <div class="game-leaderboard-head">
          <div><p class="mini-title">LEADERBOARD</p><h2>跳一跳排行</h2></div>
          <div class="game-leaderboard-actions">
            <span>最高分</span>
            <button type="button" class="game-join-btn" data-game-join-btn>参与排行榜</button>
          </div>
        </div>
        <ol class="game-ranking-list" data-game-ranking-list>
          <li class="game-ranking-empty">正在加载排行榜…</li>
        </ol>
        <div class="game-admin-panel" data-game-admin-panel hidden>
          <div class="game-admin-head">
            <p class="mini-title">ADMIN</p>
            <h3>管理游客榜单</h3>
            <button type="button" class="game-admin-refresh" data-game-admin-refresh>刷新</button>
          </div>
          <ol class="game-admin-list" data-game-admin-list></ol>
        </div>
      </aside>
    </section>
  </main>

  <div class="modal game-nickname-modal" data-game-nickname-modal>
    <button class="modal-backdrop" type="button" data-game-nickname-close aria-label="关闭"></button>
    <section class="modal-card glass-card" role="dialog" aria-modal="true" aria-labelledby="game-nickname-title">
      <button class="modal-close" type="button" data-game-nickname-close aria-label="关闭">×</button>
      <p class="mini-title">JOIN LEADERBOARD</p>
      <h2 id="game-nickname-title">参与排行榜</h2>
      <p class="game-nickname-desc">请填写您的上榜名，参与竞争榜</p>
      <form class="game-nickname-form" data-game-nickname-form>
        <input type="text" name="nickname" maxlength="20" placeholder="输入你的昵称（1-20字）" required />
        <button class="primary-button" type="submit">确认上榜</button>
      </form>
      <p class="game-nickname-error" data-game-nickname-error hidden></p>
    </section>
  </div>
</body>
</html>
